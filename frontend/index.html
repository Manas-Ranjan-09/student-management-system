<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdmin Pro | Student Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            position: relative;
            z-index: 10;
        }
        .auth-tabs {
            display: flex;
            background: var(--bg-page);
            border-radius: var(--radius-md);
            padding: 0.35rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-glass);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.65rem;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-tab.active {
            background: var(--bg-surface);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .form-control-custom {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .demo-pill {
            padding: 0.35rem 0.75rem;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: var(--transition);
        }
        .demo-pill:hover {
            transform: translateY(-1px);
            background: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header Actions -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 20; display: flex; gap: 0.75rem; align-items: center;">
        <button class="btn-secondary-custom" style="padding: 0.5rem 0.85rem; font-size: 0.85rem;" onclick="UI.openBackendConfigModal()">
            <i class="fas fa-server text-primary"></i> <span id="backend-status-text">Backend URL</span>
        </button>
        <button class="theme-toggle-btn btn-secondary-custom" style="padding: 0.5rem 0.85rem;" onclick="UI.toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <!-- Brand -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 58px; height: 58px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 1.75rem; margin-bottom: 1rem; box-shadow: 0 8px 20px var(--primary-glow);">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">EduAdmin Pro</h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Modern Student Management & Academic Portal</p>
            </div>

            <!-- Tab Buttons -->
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login-btn" onclick="showTab('login')">
                    <i class="fas fa-sign-in-alt me-1"></i> Sign In
                </div>
                <div class="auth-tab" id="tab-register-btn" onclick="showTab('register')">
                    <i class="fas fa-user-plus me-1"></i> Register Student
                </div>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Username / Roll Number</label>
                    <input type="text" id="login-username" class="form-control-custom" placeholder="e.g. admin or 2026CSE001" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control-custom" placeholder="Enter your password" required>
                </div>

                <!-- Demo Pills -->
                <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Quick Fill:</span>
                    <button type="button" class="demo-pill" onclick="fillCreds('admin', 'adminpassword')">
                        <i class="fas fa-user-shield me-1"></i> Admin
                    </button>
                    <button type="button" class="demo-pill" onclick="fillCreds('2026CSE001', 'studentpassword')">
                        <i class="fas fa-user-graduate me-1"></i> Student
                    </button>
                </div>

                <button type="submit" id="login-submit-btn" class="btn-primary-custom" style="width: 100%; justify-content: center; padding: 0.85rem;">
                    <span>Sign In to Portal</span> <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label">Student ID</label>
                        <input type="text" id="reg-id" class="form-control-custom" placeholder="STU901" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="reg-name" class="form-control-custom" placeholder="Alex Morgan" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label">Roll Number</label>
                        <input type="text" id="reg-roll" class="form-control-custom" placeholder="2026CSE099" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Reg. Number</label>
                        <input type="text" id="reg-regnum" class="form-control-custom" placeholder="REG2026099" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control-custom" placeholder="student@example.com" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select id="reg-dept" class="form-control-custom" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Course</label>
                        <select id="reg-course" class="form-control-custom" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label">Semester</label>
                        <select id="reg-sem" class="form-control-custom" required>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Academic Year</label>
                        <input type="text" id="reg-year" class="form-control-custom" value="2026-2030" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password (min 8 chars)</label>
                    <input type="password" id="reg-password" class="form-control-custom" placeholder="Create strong password" minlength="8" required>
                </div>

                <button type="submit" id="reg-submit-btn" class="btn-primary-custom" style="width: 100%; justify-content: center; padding: 0.85rem; margin-top: 0.5rem;">
                    <span>Create Account</span> <i class="fas fa-user-check"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if already logged in
        AUTH.redirectIfAuthenticated();

        function showTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                regBtn.classList.add('active');
                loginBtn.classList.remove('active');
                loadDropdowns();
            }
        }

        function fillCreds(u, p) {
            document.getElementById('login-username').value = u;
            document.getElementById('login-password').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;

            try {
                await AUTH.login(u, p);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In to Portal</span> <i class="fas fa-arrow-right"></i>';
            }
        }

        async function loadDropdowns() {
            try {
                const [depts, courses] = await Promise.all([
                    API.get('/api/departments/'),
                    API.get('/api/courses/')
                ]);

                const deptSelect = document.getElementById('reg-dept');
                deptSelect.innerHTML = depts.map(d => `<option value="${d.id}">${d.name} (${d.code})</option>`).join('');

                const courseSelect = document.getElementById('reg-course');
                courseSelect.innerHTML = courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (e) {
                console.error('Failed to load departments or courses:', e);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            const payload = {
                student_id: document.getElementById('reg-id').value.trim(),
                name: document.getElementById('reg-name').value.trim(),
                roll_number: document.getElementById('reg-roll').value.trim(),
                registration_number: document.getElementById('reg-regnum').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                department: document.getElementById('reg-dept').value,
                course: document.getElementById('reg-course').value,
                semester: document.getElementById('reg-sem').value,
                academic_year: document.getElementById('reg-year').value,
                password: document.getElementById('reg-password').value,
            };

            try {
                await AUTH.register(payload);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span> <i class="fas fa-user-check"></i>';
            }
        }
    </script>
</body>
</html>
