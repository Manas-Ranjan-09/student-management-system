{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error | EduAdmin Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body class="auth-page">
    <div class="auth-card text-center py-5">
        <div class="text-warning mb-4" style="font-size: 5rem;">
            <i class="fas fa-tools"></i>
        </div>
        <h1 class="fw-extrabold text-dark-theme-toggle" style="font-size: 3.5rem; font-family: 'Outfit';">500</h1>
        <h4 class="fw-bold mb-3">Internal Server Error</h4>
        <p class="text-secondary mb-4">Something went wrong on our servers. We are already working to resolve this issue. Please try again later.</p>
        <a href="{% url 'dashboard_redirect' %}" class="custom-btn btn-primary-custom px-4 py-3">
            <i class="fas fa-sync-alt me-2"></i> Reload Page
        </a>
    </div>
</body>
</html>
