services:
  - type: web
    name: student-management-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.netlify.app"
      - key: DATABASE_URL
        fromDatabase:
          name: sms-postgres
          property: connectionString

databases:
  - name: sms-postgres
    databaseName: sms_db
    user: sms_user
    plan: free
